<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SZL-BOT - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      justify-content: center;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
      display: flex;
    }
    
    .login-container {
      max-width: 440px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 28px;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .login-logo {
      font-size: 3.5rem;
      font-family: var(--font-title);
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .login-logo span {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .discord-login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      padding: 16px 24px;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }

    .discord-login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5), var(--shadow-glow);
    }

    .discord-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .error-badge {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid var(--danger-color);
      color: #ff7675;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      line-height: 1.4;
      display: none;
      animation: shake 0.4s ease;
    }

    .terminal-header {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 15px 15px 0 0;
      margin: -28px -28px 12px -28px;
    }

    .terminal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background: #f43f5e; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="glow-bg-secondary"></div>

  <div class="login-container card-blur">
    <!-- Terminal window controls decor -->
    <div class="terminal-header">
      <div class="terminal-dot dot-red"></div>
      <div class="terminal-dot dot-yellow"></div>
      <div class="terminal-dot dot-green"></div>
      <span style="font-size: 0.75rem; color: var(--text-muted); font-family: var(--font-mono); margin-left: 8px;">szl-bot --login</span>
    </div>

    <div>
      <div class="login-logo">SZL<span>-BOT</span></div>
      <p class="login-subtitle">Dashboard do Bot de Programação. Autentique-se com sua conta do Discord para gerenciar avisos, changelogs e repositórios.</p>
    </div>

    <!-- Badge de Erro -->
    <div id="errorBadge" class="error-badge"></div>

    <a href="/api/auth/discord" class="discord-login-btn">
      <svg class="discord-icon" viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a77.7,77.7,0,0,0,6.63-10.85,68.43,68.43,0,0,1-10.5-5c.79-.58,1.56-1.2,2.3-1.84a75.47,75.47,0,0,0,73.4,0c.74.64,1.51,1.26,2.3,1.84a68.43,68.43,0,0,1-10.5,5A77.7,77.7,0,0,0,112.1,86.4a105.73,105.73,0,0,0,31-18.83C145.55,48.5,139.15,25.74,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.83,46,53.83,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.07,46,96.07,53,91,65.69,84.69,65.69Z"/>
      </svg>
      Entrar com o Discord
    </a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const errorBadge = document.getElementById('errorBadge');

    if (error) {
      errorBadge.style.display = 'block';
      if (error === 'unauthorized') {
        errorBadge.textContent = '❌ Acesso Negado: Você não tem permissão para acessar este painel. Fale com um administrador do servidor.';
      } else if (error === 'auth_failed') {
        errorBadge.textContent = '❌ Erro de Autenticação: Falha ao validar sua conta no Discord. Tente novamente.';
      } else if (error === 'no_code') {
        errorBadge.textContent = '❌ Código Expirado: Fluxo de autenticação inválido.';
      } else {
        errorBadge.textContent = '❌ Ocorreu um erro ao tentar fazer login.';
      }
    }
  </script>
</body>
</html>
